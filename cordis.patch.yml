# Bundle patch for dsh-tag-memory.
#
# Root row: profile plane — memory-file hosting and the /tag-memory-api routes.
# Preset row: profile plane as well — tag dictionary + memory snapshot injection,
#             and the memory_write / memory_recall tools for every agent.
#
# Both halves live in the bundle patch so the official install path
# (`dsh plugin add`) mounts a complete plugin instead of a half-installed one.
- insert:
    - id: tag-memory
      name: dsh-tag-memory
    - id: tag-memory-preset
      name: dsh-tag-memory/preset
