name: Diagnose S3

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/_diag-s3.mjs'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node scripts/_diag-s3.mjs
